# keep the build backend in sync with the locked build group below.
[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "perception-under-uncertainty"
version = "0.1.0"
description = "Reproducible evaluation scaffolding for perception under degraded sensing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "huggingface-hub>=2.3.0",
  "numpy<2",
  "pydantic>=2.14.1,<3",
  "torch==2.2.2",
  "torchvision==0.17.2",
  "ultralytics>=8.4.189",
]

# the smoke check stays small, model libraries arrive with the first experiment.
[dependency-groups]
dev = ["pytest>=9.1.1,<10", "ruff==0.17.2"]
build = ["setuptools==84.2.1"]

[tool.uv]
required-version = "==0.12.19"
default-groups = ["dev", "build"]
# install the locked backend before building this package, including editable installs.
no-build-isolation-package = ["perception-under-uncertainty"]

[project.scripts]
ppu = "perception_under_uncertainty.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
