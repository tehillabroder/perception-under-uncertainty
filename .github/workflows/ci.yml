# check the installed package and the linux container before trusting a change.
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.19'
          python-version: '3.12.13'
          enable-cache: true
      - name: install the locked environment
        run: uv sync --locked
      - name: check formatting and lint
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
      - name: build and install the wheel
        run: |
          uv build --no-build-isolation
          uv pip install --no-deps --reinstall dist/*.whl
      # use the installed wheel directly so source imports cannot hide packaging errors.
      - name: test the installed package
        run: .venv/bin/python -m pytest
      - name: check the installed command
        run: .venv/bin/ppu run --config configs/smoke.json

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build the linux image with source metadata
        run: |
          docker buildx build --load --platform linux/amd64 \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --build-arg SOURCE_DIRTY=false \
            --tag perception-under-uncertainty:ci .
      - name: check the vision libraries and CPU operations without downloads
        run: |
          docker run --rm --network none -i --entrypoint python \
            perception-under-uncertainty:ci - <<'PY'
          import cv2
          import numpy as np
          import torch
          import torchvision
          from sahi import AutoDetectionModel
          from ultralytics import YOLO
          from scripts.evaluate_post1_sample import collect_predictions

          assert callable(YOLO) and callable(AutoDetectionModel.from_pretrained)
          assert callable(collect_predictions)
          assert (torch.ones((2, 2)) @ torch.ones((2, 2))).tolist() == [[2.0, 2.0], [2.0, 2.0]]
          boxes = torch.tensor([[0., 0., 10., 10.], [1., 1., 9., 9.]])
          assert torchvision.ops.nms(boxes, torch.tensor([0.9, 0.8]), 0.5).tolist() == [0]
          assert cv2.resize(np.zeros((4, 4, 3), dtype=np.uint8), (2, 2)).shape == (2, 2, 3)
          print("Vision imports, research runner import and CPU operations passed; no model inference.")
          PY
      - name: run with a writable host output directory
        run: |
          mkdir -p artifacts/container
          image_id=$(docker image inspect --format '{{.Id}}' perception-under-uncertainty:ci)
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            --env PPU_IMAGE_ID="$image_id" \
            --mount "type=bind,source=$PWD/artifacts/container,target=/results" \
            perception-under-uncertainty:ci
      - name: check the container record
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifests = list(Path("artifacts/container").glob("*/run_manifest.json"))
          assert len(manifests) == 1
          manifest = json.loads(manifests[0].read_text())
          assert manifest["smoke_check"] == "passed"
          assert manifest["model_inference_performed"] is False
          assert manifest["dataset_evaluated"] is False
          assert manifest["source"]["revision"] == os.environ["GITHUB_SHA"]
          assert manifest["source"]["dirty"] is False
          assert manifest["environment"]["system"] == "Linux"
          assert manifest["environment"]["image_id"].startswith("sha256:")
          assert manifest["effective_config"]["output_dir"] == "/results"
          assert manifest["lockfile_sha256"] == hashlib.sha256(Path("uv.lock").read_bytes()).hexdigest()
          PY
      - name: reproduce the saved confidence table without inference
        run: |
          mkdir -p artifacts/container-analysis
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            --entrypoint python \
            --mount "type=bind,source=$PWD/runs/dut_300_evaluation,target=/inputs,readonly" \
            --mount "type=bind,source=$PWD/artifacts/container-analysis,target=/results" \
            perception-under-uncertainty:ci \
            -m scripts.sweep_post1_confidence \
            --cache /inputs/predictions.json --output /results/confidence_sweep.csv
          python3 - <<'PY'
          import csv
          from pathlib import Path

          def rows(path):
              with Path(path).open(newline="", encoding="utf-8") as file:
                  return list(csv.DictReader(file))

          expected = rows("runs/dut_300_evaluation/confidence_sweep.csv")
          actual = rows("artifacts/container-analysis/confidence_sweep.csv")
          assert len(actual) == 24
          assert actual == expected
          print("All 24 confidence rows match the saved evaluation.")
          PY
